<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="application-name" content="zpa-atlas"><title data-i18n="page.entity.title"></title><link rel="stylesheet" href="app.css"></head>
<body>
<header class="top"><a href="./">Atlas</a><form class="find" action="./"><input type="text" name="q" data-i18n-placeholder="header.search"><input type="hidden" name="lang"></form><span class="run" data-i18n="banner.loading"></span></header>
<div id="warn" class="warn" hidden></div>
<main class="entity">
  <aside id="side" class="card">
    <div id="header"></div>
    <nav id="sections"></nav>
    <section id="definitions"></section>
    <section id="parameters"></section>
    <section id="overloads"></section>
  </aside>
  <div id="content">
    <section id="children"></section>
    <section id="values"></section>
    <section id="usage">
      <h2 data-i18n="usage.title"></h2>
      <div id="scope"></div>
      <div id="roleChips"></div>
      <div id="statusChips"></div>
      <p id="total" class="muted"></p>
      <div id="direct"></div>
      <section id="ambiguous" hidden><h2 data-i18n="usage.ambiguous"></h2><div id="ambiguousRows"></div></section>
      <button id="more" data-i18n="usage.more" hidden></button>
    </section>
    <section id="relations"></section>
    <section id="triggers"></section>
    <section id="viewReads"></section>
    <section id="views"></section>
    <section id="baseColumns"></section>
    <section id="viewColumns"></section>
  </div>
</main>
<script src="common.js"></script>
<script src="entity.js"></script>
</body>
</html>
