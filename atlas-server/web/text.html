<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="application-name" content="zpa-atlas"><meta name="viewport" content="width=device-width, initial-scale=1"><title data-i18n="page.text.title"></title><link rel="stylesheet" href="app.css"></head>
<body>
<header class="top"><a href="./" class="home" data-keep-lang>Atlas</a><button type="button" class="goto"><span data-i18n="goto.open"></span><kbd>Ctrl K</kbd></button><nav class="pages"><a href="./" class="nav" data-keep-lang data-i18n="header.objects"></a><a href="query.html" class="nav" data-keep-lang data-i18n="header.uses"></a><a href="text.html" class="nav" data-keep-lang data-i18n="header.code"></a></nav><button type="button" class="run" aria-expanded="false" data-i18n="banner.loading"></button></header>
<main class="query-page text-page">
  <h1 data-i18n="text.heading"></h1>
  <p class="muted page-intro" data-i18n="text.intro"></p>
  <form id="query" class="card query" autocomplete="off">
    <div class="front text-front">
      <label class="label" for="text"><span data-i18n="text.text"></span>
        <input type="text" id="text" name="text" data-i18n-placeholder="text.text.placeholder"></label>
      <div class="suggest" data-param="container" data-typed="containerName">
        <label class="label" for="within" data-i18n="query.container"></label>
        <div class="box">
          <input type="text" id="within" name="within" data-i18n-placeholder="query.container.placeholder" role="combobox" aria-autocomplete="list" aria-expanded="false">
          <div class="picked" hidden><span class="pick-name"></span><span class="kind pick-kind"></span><button type="button" class="x" data-i18n-title="query.unpick">×</button></div>
        </div>
        <ul class="suggestions" role="listbox" hidden></ul>
      </div>
      <label class="label" for="path"><span data-i18n="text.path"></span>
        <input type="text" id="path" name="path" data-i18n-placeholder="text.path.placeholder"></label>
      <div class="actions">
        <span class="label" aria-hidden="true">&nbsp;</span>
        <div class="buttons"><button data-i18n="text.run"></button></div>
      </div>
    </div>
  </form>
  <section id="try" class="try-box" hidden></section>
  <div id="answer"></div>
</main>
<script type="module" src="./src/text.ts"></script>
</body>
</html>
