name: Release

# Release Please keeps a release PR open on main. Merging it sets the release version in gradle.properties, tags the
# commit X.Y.Z (no v) and creates a draft release. This workflow then attaches the assets to the draft: the zip of the
# distribution, and a sample index of utPLSQL with the sources and license it was built from. It also runs the Image
# workflow on the tag, which publishes the release image. The notes are written, and the draft published, by hand.
#
# A manual run on main attaches the assets to the empty draft of an existing release tag, after a failed run.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag (X.Y.Z, no v) whose empty draft release gets its assets. Run from main.'
        required: true
        type: string

permissions:
  contents: read

env:
  JAVA_VERSION: 25
  # The utPLSQL release of the sample index.
  UTPLSQL_REF: v.3.2.3

jobs:
  release_please:
    name: Release Please
    # A manual recovery must not run Release Please (no PRs or tags).
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ github.token }}

  verify:
    name: Check the release commit
    needs: release_please
    # release_please is skipped on a manual run, which would skip this job under the implicit success(): !cancelled()
    # lifts that, and the conditions below decide. On a push, release_please must have succeeded and created a release.
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'push' && needs.release_please.result == 'success' && needs.release_please.outputs.release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-26.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ env.RELEASE_VERSION }}
      tag: ${{ env.RELEASE_TAG }}
    env:
      RELEASE_VERSION: ${{ needs.release_please.outputs.version || inputs.release_tag }}
      RELEASE_TAG: ${{ needs.release_please.outputs.tag_name || inputs.release_tag }}
    steps:
      # Automatic: the Release Please commit. Manual recovery: the existing tag, never main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_please.outputs.sha || format('refs/tags/{0}', inputs.release_tag) }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the release commit
        id: commit
        env:
          RELEASE_SHA: ${{ needs.release_please.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ${GITHUB_EVENT_NAME} == workflow_dispatch ]]; then
            [[ ${RELEASE_TAG} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              printf 'The release tag must be a stable X.Y.Z, with no v: %s\n' "${RELEASE_TAG}" >&2
              exit 1
            }
            RELEASE_SHA=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
            # Release Please tags the commit that merged its PR, a merge commit or a squash: its manifest has the tag's
            # version. The next step checks gradle.properties.
            manifest_version=$(jq -r '."."' .release-please-manifest.json)
            [[ ${manifest_version} == "${RELEASE_TAG}" ]] || {
              printf 'Tag %s is not a Release Please release: its manifest says %s\n' "${RELEASE_TAG}" "${manifest_version}" >&2
              exit 1
            }
            git merge-base --is-ancestor HEAD origin/main || {
              printf 'Tag %s is not in the history of main\n' "${RELEASE_TAG}" >&2
              exit 1
            }
          fi
          [[ ${RELEASE_SHA} =~ ^[0-9a-f]{40}$ ]] || {
            printf 'Invalid release commit: %s\n' "${RELEASE_SHA}" >&2
            exit 1
          }
          [[ $(git rev-parse HEAD) == "${RELEASE_SHA}" ]] || {
            printf 'The checked out commit is not the release commit\n' >&2
            exit 1
          }
          echo "sha=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"

      # A release depends only on stable versions: of itself, and of zpa.
      - name: Check the versions are stable
        shell: bash
        run: |
          set -euo pipefail
          property() { sed -n "s/^$1=//p" gradle.properties | tr -d '\r'; }
          project_version=$(property version)
          zpa_version=$(property zpaVersion)
          [[ ${project_version} == "${RELEASE_VERSION}" ]] || {
            printf 'The version of gradle.properties, %s, is not the release version %s\n' "${project_version}" "${RELEASE_VERSION}" >&2
            exit 1
          }
          [[ ${RELEASE_TAG} == "${RELEASE_VERSION}" ]] || {
            printf 'The release tag %s is not the release version %s\n' "${RELEASE_TAG}" "${RELEASE_VERSION}" >&2
            exit 1
          }
          [[ ${RELEASE_VERSION} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'The release version must be a stable X.Y.Z, with no v: %s\n' "${RELEASE_VERSION}" >&2
            exit 1
          }
          [[ ${zpa_version} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'zpaVersion must be a stable X.Y.Z: %s\n' "${zpa_version}" >&2
            exit 1
          }
          printf 'version=%s\ntag=%s\nzpaVersion=%s\n' "${RELEASE_VERSION}" "${RELEASE_TAG}" "${zpa_version}"

  distribution:
    name: Build the distribution
    needs: verify
    # Not skipped when release_please was (a manual run): verify decides.
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-26.04
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # build includes the zip of atlas-cli's distribution (distZip), named with the version.
      - name: Build with Gradle
        run: ./gradlew build

      - name: Check the zip
        shell: bash
        run: |
          set -euo pipefail
          zip="atlas-cli/build/distributions/zpa-atlas-${RELEASE_VERSION}.zip"
          [[ -f ${zip} ]] || {
            printf 'The zip of the distribution is missing: %s\n' "${zip}" >&2
            exit 1
          }
          for entry in bin/zpa-atlas bin/zpa-atlas.bat LICENSE NOTICE THIRD-PARTY.md; do
            unzip -l "${zip}" "zpa-atlas-${RELEASE_VERSION}/${entry}" > /dev/null || {
              printf 'The zip has no %s\n' "${entry}" >&2
              exit 1
            }
          done
          mkdir -p assets
          cp "${zip}" assets/

      - name: Upload the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-distribution
          path: assets/
          if-no-files-found: error
          retention-days: 7

  sample_index:
    name: Build the sample index
    needs: verify
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-26.04

    # The same database, utPLSQL install and indexing as the Runbook workflow, on the release commit.
    services:
      oracle:
        image: gvenzl/oracle-free:23.26.3-slim-faststart
        env:
          ORACLE_PASSWORD: oracle
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      ORACLE_IMAGE: gvenzl/oracle-free:23.26.3-slim-faststart
      ORACLE_SERVICE: FREEPDB1
      ORACLE_URL: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
      # The password of the UT3 schema of this job's throwaway database: not a secret.
      ZPA_ORACLE_PASSWORD: ut3
      JAVA_OPTS: -Xmx4g
      OJDBC_VERSION: 23.26.3.0.0
      OJDBC_SHA256: 17ad1c2d5242432cc4db9e2a7f67762bc8a4086cbcb3cd81f6ffaa2a510c41d8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Check out utPLSQL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: utPLSQL/utPLSQL
          ref: ${{ env.UTPLSQL_REF }}
          path: utplsql
          persist-credentials: false

      # The index holds the text of every line of the sources, so the release carries them, with utPLSQL's license.
      # The index is built from this archive unpacked, never from the checkout, where the install writes its files.
      - name: Package the utPLSQL sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets sample
          git -C utplsql archive --format=tar.gz --prefix="utplsql-${UTPLSQL_REF}/" \
            -o "${GITHUB_WORKSPACE}/assets/utplsql-${UTPLSQL_REF}-sources.tar.gz" HEAD source LICENSE
          cp utplsql/LICENSE "assets/utplsql-${UTPLSQL_REF}-LICENSE"
          tar -xzf "assets/utplsql-${UTPLSQL_REF}-sources.tar.gz" -C sample

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Build the distribution
        run: ./gradlew :atlas-cli:installDist

      - name: Install the Oracle JDBC driver
        shell: bash
        run: |
          set -euo pipefail
          jar="ojdbc17-${OJDBC_VERSION}.jar"
          dist=atlas-cli/build/install/zpa-atlas
          curl -fsSL -o "${RUNNER_TEMP}/${jar}" "https://repo1.maven.org/maven2/com/oracle/database/jdbc/ojdbc17/${OJDBC_VERSION}/${jar}"
          echo "${OJDBC_SHA256}  ${RUNNER_TEMP}/${jar}" | sha256sum --check -
          mkdir -p "${dist}/drivers"
          cp "${RUNNER_TEMP}/${jar}" "${dist}/drivers/"
          echo "${GITHUB_WORKSPACE}/${dist}/bin" >> "${GITHUB_PATH}"

      - name: Install utPLSQL as UT3
        shell: bash
        run: |
          set -euo pipefail
          chmod -R a+w utplsql/source
          docker run --rm --network host -v "${GITHUB_WORKSPACE}/utplsql/source:/source" -w /source \
            --entrypoint sqlplus "${ORACLE_IMAGE}" -L -S \
            "sys/oracle@//127.0.0.1:1521/${ORACLE_SERVICE} as sysdba" \
            @install_headless.sql UT3 "${ZPA_ORACLE_PASSWORD}" users

      # Built by the binary of the release, so the index has its schema version.
      - name: Index with metadata
        shell: bash
        run: |
          set -euo pipefail
          db="assets/zpa-atlas-${RELEASE_VERSION}-utplsql-${UTPLSQL_REF}.db"
          zpa-atlas index --sources "sample/utplsql-${UTPLSQL_REF}/source" --out "${db}" --compilation-schema UT3 \
            --oracle-url "${ORACLE_URL}" --oracle-user ut3 --oracle-schemas UT3
          zpa-atlas stats "${db}"

      - name: Upload the sample index
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-sample-index
          path: assets/
          if-no-files-found: error
          retention-days: 7

  assets:
    name: Attach the assets to the draft release
    needs: [verify, distribution, sample_index]
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success' &&
        needs.distribution.result == 'success' && needs.sample_index.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      # Runs the Image workflow on the tag.
      actions: write
    concurrency:
      group: release-${{ needs.verify.outputs.version }}
      cancel-in-progress: false
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the draft release has no assets yet
        shell: bash
        run: |
          set -euo pipefail
          # The by-tag endpoint hides drafts, so list the releases instead.
          releases=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -s --arg tag "${RELEASE_TAG}" '[.[][] | select(.tag_name == $tag)]')
          [[ $(jq -r 'length == 1 and .[0].draft and (.[0].assets | length == 0)' <<< "${releases}") == true ]] || {
            printf 'Expected one draft release for %s with no assets; remove partial assets by hand: %s\n' \
              "${RELEASE_TAG}" "$(jq -c 'map({draft, assets: (.assets | length)})' <<< "${releases}")" >&2
            exit 1
          }

      - name: Download the assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      # The notes stay as Release Please wrote them, for Felipe to edit; the release stays a draft.
      - name: Attach the assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          token: ${{ github.token }}
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            assets/zpa-atlas-${{ env.RELEASE_VERSION }}.zip
            assets/zpa-atlas-${{ env.RELEASE_VERSION }}-utplsql-${{ env.UTPLSQL_REF }}.db
            assets/utplsql-${{ env.UTPLSQL_REF }}-sources.tar.gz
            assets/utplsql-${{ env.UTPLSQL_REF }}-LICENSE

      # A tag made with the workflow token starts no workflow, a manual run does: the Image workflow publishes the
      # release image from the tag.
      - name: Publish the release image
        run: gh workflow run image.yml --ref "${RELEASE_TAG}" -f version="${RELEASE_VERSION}"
