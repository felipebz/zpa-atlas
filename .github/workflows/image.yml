name: Image

# The container image (Dockerfile, docs/container.md). Pull requests build it for both platforms without pushing.
# Each push to main whose Build workflow passed pushes a snapshot to ghcr.io as edge and sha-<commit>; a v* tag, or a
# manual run, pushes a release.
on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows:
      - Build
    types:
      - completed
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, such as 1.2.3 (default: the tag the run is on)'
        required: false

env:
  IMAGE: ghcr.io/felipebz/zpa-atlas
  PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for both platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: false
          build-args: |
            REVISION=${{ github.sha }}

  snapshot:
    name: Publish snapshot
    # Only after Build passed on a push to main: a fork's pull request never publishes, and a broken build is never edge.
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      # The commit Build tested, not github.sha: on workflow_run that is the default branch's newest commit. The checkout
      # of a commit is a detached HEAD, so metadata-action cannot read it from git either.
      - name: Commit
        id: commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # A snapshot never moves latest: that tag is the newest release.
          flavor: |
            latest=false
          tags: |
            type=raw,value=edge
            type=raw,value=sha-${{ steps.commit.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No VERSION: the image reports the version of gradle.properties, a -SNAPSHOT one, and zpa's latest snapshot.
      - name: Build and push for both platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REVISION=${{ github.event.workflow_run.head_sha }}

      # Keeps the newest snapshots; releases, edge and latest are never touched.
      - name: Remove old snapshots
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          delete-tags: 'sha-*'
          keep-n-tagged: 20
          exclude-tags: edge,latest
          delete-untagged: true

  publish:
    name: Publish
    if: github.ref_type == 'tag' && github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # A pre-release such as 1.0.0-rc.1 does not move latest.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}

      # metadata-action names no authors: the Dockerfile's labels stay, not the base image's.
      - name: Require a version
        if: steps.meta.outputs.version == ''
        run: |
          echo "No version: run on a v* tag, or give the version input." >&2
          exit 1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push for both platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
