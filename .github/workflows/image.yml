name: Image

# The container image (Dockerfile, docs/container.md). Pull requests build it for both platforms without pushing.
# Each push to main whose Build workflow passed pushes a snapshot to ghcr.io as edge and sha-<commit>; a release tag
# (1.2.3, no v, as Release Please makes it), or a manual run, pushes a release. Release Please creates its tag with the
# workflow token, which starts no workflow, so the Release workflow runs this one by hand on the tag.
# A pull request (where a new base image arrives) and a release scan the image before anything is pushed: the job fails
# only on a critical vulnerability that has a fix.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_run:
    workflows:
      - Build
    types:
      - completed
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, such as 1.2.3 (default: the tag the run is on)'
        required: false

env:
  IMAGE: ghcr.io/felipebz/zpa-atlas
  PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for both platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: false
          build-args: |
            REVISION=${{ github.sha }}

      # Built for this runner's platform into its Docker, and scanned before anything is pushed.
      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: zpa-atlas:scan
          build-args: |
            REVISION=${{ github.sha }}

      # The log lists the vulnerabilities that have a fix; only a critical one fails the job.
      - name: Scan for vulnerabilities
        uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
        with:
          image: zpa-atlas:scan
          only-fixed: true
          severity-cutoff: critical
          output-format: table

  snapshot:
    name: Publish snapshot
    # Only after Build passed on a push to main: a fork's pull request never publishes, and a broken build is never edge.
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      # The commit Build tested, not github.sha: on workflow_run that is the default branch's newest commit. The checkout
      # of a commit is a detached HEAD, so metadata-action cannot read it from git either.
      - name: Commit
        id: commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # A snapshot never moves latest: that tag is the newest release.
          flavor: |
            latest=false
          tags: |
            type=raw,value=edge
            type=raw,value=sha-${{ steps.commit.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No VERSION: the image reports the version of gradle.properties, which on main is the last release's until the
      # next release PR is merged.
      - name: Build and push for both platforms
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REVISION=${{ github.event.workflow_run.head_sha }}

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Keeps the newest snapshots; releases, edge and latest are never touched.
      - name: Remove old snapshots
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          delete-tags: 'sha-*'
          keep-n-tagged: 20
          exclude-tags: edge,latest
          delete-untagged: true
          delete-orphaned-images: true

  publish:
    name: Publish
    if: github.ref_type == 'tag' && github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # A pre-release such as 1.0.0-rc.1 does not move latest.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}

      # metadata-action names no authors: the Dockerfile's labels stay, not the base image's.
      - name: Require a version
        if: steps.meta.outputs.version == ''
        run: |
          echo "No version: run on a release tag such as 1.2.3, or give the version input." >&2
          exit 1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built for this runner's platform into its Docker, and scanned before anything is pushed.
      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: zpa-atlas:scan
          build-args: |
            REVISION=${{ github.sha }}

      # The log lists the vulnerabilities that have a fix; only a critical one fails the job.
      - name: Scan for vulnerabilities
        uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
        with:
          image: zpa-atlas:scan
          only-fixed: true
          severity-cutoff: critical
          output-format: table

      - name: Build and push for both platforms
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
