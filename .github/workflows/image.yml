name: Image

# The container image (Dockerfile, docs/container.md). Pull requests and main build it for both platforms without
# pushing; a v* tag, or a manual run, also pushes it to ghcr.io.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, such as 1.2.3 (default: the tag the run is on)'
        required: false

env:
  IMAGE: ghcr.io/felipebz/zpa-atlas
  PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.event_name == 'pull_request' || github.ref_type == 'branch' && github.event_name == 'push'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for both platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: false
          build-args: |
            REVISION=${{ github.sha }}

  publish:
    name: Publish
    if: github.ref_type == 'tag' && github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # A pre-release such as 1.0.0-rc.1 does not move latest.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}

      # metadata-action names no authors: the Dockerfile's labels stay, not the base image's.
      - name: Require a version
        if: steps.meta.outputs.version == ''
        run: |
          echo "No version: run on a v* tag, or give the version input." >&2
          exit 1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push for both platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
